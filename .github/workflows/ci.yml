name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_URL: https://doanhnghiep1nguoi.online
          NEXT_PUBLIC_SITE_NAME: "Doanh Nghiệp 1 Người"
          NEXT_PUBLIC_OWNER_NAME: "Thiên Huệ"
          NEXT_PUBLIC_COLOR_BRAND: "#E85D04"
          SUPABASE_SERVICE_ROLE_KEY: placeholder
